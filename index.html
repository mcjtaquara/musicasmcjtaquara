  <style>
    :root {
      --wine: #6d1b3a;
      --wine-dark: #4c1229;
      --gold: #d4af6a;
      --gold-light: #f0dcae;
      --cream: #fbf7f0;
      --ink: #2a1f22;
      --muted: #8a7a80;
      --card: #ffffff;
      --shadow: 0 4px 18px rgba(76, 18, 41, 0.10);
      --radius: 16px;
      --font-ui: 'Inter', sans-serif;
      --font-head: 'Poppins', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Consolas', 'Courier New', monospace;
      --cifra-size: 16px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--cream);
      font-family: var(--font-ui);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }
    #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* ---------- Top bar ---------- */
    .topbar {
      background: linear-gradient(120deg, var(--wine), var(--wine-dark));
      color: #fff;
      padding: 18px 18px 16px;
      flex-shrink: 0;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 2;
    }
    .topbar h1 {
      font-family: var(--font-head);
      font-size: 20px;
      margin: 0 0 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.2px;
    }
    .logo-badge {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fdfaf5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }
    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .topbar .subtitle {
      font-size: 12px;
      color: var(--gold-light);
      margin: 0 0 14px;
      opacity: 0.9;
    }
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-family: var(--font-ui);
      outline: none;
      background: rgba(255,255,255,0.95);
      color: var(--ink);
    }
    .search-box input::placeholder { color: #a89298; }
    .search-box .clear-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      display: none;
      line-height: 1;
    }
    .search-box .clear-btn.show { display: block; }

    /* ---------- List screen ---------- */
    #screen-list { flex: 1; min-height: 0; display: none; flex-direction: column; }
    .result-meta {
      padding: 10px 18px 4px;
      font-size: 12.5px;
      color: var(--muted);
      flex-shrink: 0;
    }
    #song-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px 12px 24px;
    }
    .song-item {
      background: var(--card);
      border-radius: var(--radius);
      padding: 13px 16px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.08s ease;
      border: 1px solid rgba(109,27,58,0.06);
    }
    .song-item:active { transform: scale(0.98); }
    .song-item .info { min-width: 0; }
    .song-item .title {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 15px;
      color: var(--wine-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-item .artist {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-item .page-badge {
      flex-shrink: 0;
      background: var(--gold-light);
      color: var(--wine-dark);
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 20px;
      min-width: 30px;
      text-align: center;
    }
    .snippet {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: #a5828f;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .snippet mark, .song-item .title mark {
      background: var(--gold-light);
      color: var(--wine-dark);
      border-radius: 3px;
      padding: 0 1px;
    }
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 14px;
    }

    /* ---------- Song screen ---------- */
    #screen-song {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      background: var(--cream);
    }
    .song-header {
      background: linear-gradient(120deg, var(--wine), var(--wine-dark));
      color: #fff;
      padding: 14px 14px 12px;
      flex-shrink: 0;
      box-shadow: var(--shadow);
      z-index: 2;
    }
    .song-header .row1 {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .song-header .titles { min-width: 0; flex: 1; }
    .song-header .titles .t {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-header .titles .a {
      font-size: 12px;
      color: var(--gold-light);
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-pill {
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-ui);
    }
    .tool-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--wine-dark);
      font-weight: 600;
    }
    .font-controls {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      overflow: hidden;
    }
    .font-controls button {
      background: none; border: none; color: #fff;
      width: 30px; height: 30px; font-size: 15px; cursor: pointer;
    }
    .font-controls span {
      font-size: 11px; color: var(--gold-light); padding: 0 4px;
    }
    .speed-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 4px 10px;
      flex: 1;
      min-width: 140px;
    }
    .speed-wrap span { font-size: 11px; color: var(--gold-light); white-space: nowrap; }
    .speed-wrap input[type=range] {
      flex: 1;
      accent-color: var(--gold);
    }
    .wake-status {
      font-size: 10.5px;
      color: var(--gold-light);
      margin-top: 6px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .wake-status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #7bd88f;
      display: inline-block;
    }
    .wake-status.off .dot { background: #d88f7b; }

    #cifra-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 20px 16px 60px;
    }
    #cifra-content {
      font-family: var(--font-mono);
      font-size: var(--cifra-size);
      line-height: 1.65;
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 16px;
      box-shadow: var(--shadow);
      color: var(--ink);
      max-width: 720px;
      margin: 0 auto;
    }
    .cifra-line {
      white-space: pre;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      /* esconde a scrollbar horizontal (fallback raro), mantendo a rolagem por toque */
      scrollbar-width: none;
    }
    .cifra-line::-webkit-scrollbar { display: none; }
    .cifra-line.chordline { color: var(--wine); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(109,27,58,0.25); border-radius: 4px; }

    @media (min-width: 640px) {
      .topbar h1 { font-size: 22px; }
      #song-list { padding: 10px 24px 30px; }
    }
  </style>
</head>

        <p class="subtitle">Movimento de Casais Jovens · busque por título, artista, trecho ou página</p>
        <div class="search-box">
          <input id="search-input" type="text" placeholder="Buscar por título, artista, trecho da letra ou nº da página...">
          <button class="clear-btn" id="clear-search">✕</button>
        </div>
      </div>
      <div class="result-meta" id="result-meta"></div>
      <div id="song-list"></div>
    </div>

    <!-- ===================== SONG SCREEN ===================== -->
    <div id="screen-song">
      <div class="song-header">
        <div class="row1">
          <button class="back-btn" id="back-btn" aria-label="Voltar">←</button>
          <div class="titles">
            <div class="t" id="song-title">—</div>
            <div class="a" id="song-artist"></div>
          </div>
          <div class="page-pill" id="song-page">pág. —</div>
        </div>
        <div class="toolbar">
          <button class="tool-btn" id="play-btn">▶ Rolagem</button>
          <div class="speed-wrap">
            <span>Veloc.</span>
            <input type="range" id="speed-range" min="1" max="10" step="1" value="4">
          </div>
          <div class="font-controls">
            <button id="font-minus">A−</button>
            <span id="font-size-label">16</span>
            <button id="font-plus">A+</button>
          </div>
          <button class="tool-btn" id="wake-btn">🔆 Tela ativa</button>
        </div>
        <div class="wake-status off" id="wake-status"><span class="dot"></span><span id="wake-status-text">Tela pode bloquear normalmente</span></div>
      </div>
      <div id="cifra-scroll">
        <div id="cifra-content"></div>
      </div>
    </div>

    <!-- ===================== TELA DE CARREGAMENTO ===================== -->
    <div id="screen-loading" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px; text-align:center;">
      <div style="width:42px; height:42px; border:4px solid var(--gold-light); border-top-color:var(--wine); border-radius:50%; animation:spin 0.9s linear infinite;"></div>
      <div style="color:var(--muted); font-size:14px;">Carregando as músicas...</div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>

    <!-- ===================== TELA DE ERRO ===================== -->
    <div id="screen-error" style="flex:1; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px; text-align:center;">
      <div style="font-size:34px;">📡</div>
      <div style="color:var(--wine-dark); font-weight:600; font-size:15px;">Não consegui carregar as músicas</div>
      <div style="color:var(--muted); font-size:13px; max-width:320px;">Verifique sua conexão com a internet e tente novamente.</div>
      <button id="retry-btn" style="background:var(--wine); color:#fff; border:none; padding:10px 22px; border-radius:10px; font-size:14px; cursor:pointer; font-family:var(--font-ui);">Tentar de novo</button>
    </div>

  </div>

<script>
  // ===================== Fonte dos dados =====================
  // Cole aqui a URL do seu Apps Script publicado (termina em /exec).
  const API_URL = "https://script.google.com/macros/s/AKfycbyNy181zfwxhSNhi2uYPgtQlxwca-F0btMk336M63ihmNVm182Uv7yReeHWXZ5y-QM5hw/exec";

  // ---------- Dados ----------
  let SONGS = [];
  let SONGS_SORTED = [];

  function normalize(str) {
    return (str || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase();
  }

  function collator() {
    return new Intl.Collator('pt-BR', { sensitivity: 'base' });
  }

  function initSongs(data) {
    SONGS = data;
    SONGS.forEach(function(s) {
      s._searchTitle = normalize(s.title + ' ' + s.artist);
      s._searchFull = normalize(s.title + ' ' + s.artist + ' ' + s.cifra);
    });
    SONGS_SORTED = SONGS.slice().sort(function(a, b) {
      return collator().compare(a.title, b.title);
    });
  }

  function showLoading() {
    document.getElementById('screen-loading').style.display = 'flex';
    document.getElementById('screen-error').style.display = 'none';
    screenList.style.display = 'none';
  }
  function showError() {
    document.getElementById('screen-loading').style.display = 'none';
    document.getElementById('screen-error').style.display = 'flex';
    screenList.style.display = 'none';
  }
  function showApp() {
    document.getElementById('screen-loading').style.display = 'none';
    document.getElementById('screen-error').style.display = 'none';
    screenList.style.display = 'flex';
  }

  function loadSongs() {
    showLoading();
    fetch(API_URL)
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        initSongs(data.songs || data);
        showApp();
        renderList();
        router();
      })
      .catch(function(err) {
        console.error('Erro ao carregar músicas:', err);
        showError();
      });
  }
  document.getElementById('retry-btn').addEventListener('click', loadSongs);

  // ---------- Elementos ----------
  const searchInput = document.getElementById('search-input');
  const clearBtn = document.getElementById('clear-search');
  const listEl = document.getElementById('song-list');
  const metaEl = document.getElementById('result-meta');
  const screenList = document.getElementById('screen-list');
  const screenSong = document.getElementById('screen-song');

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const idx = normalize(text).indexOf(query);
    if (idx === -1) return escapeHtml(text);
    const before = text.slice(0, idx);
    const match = text.slice(idx, idx + query.length);
    const after = text.slice(idx + query.length);
    return escapeHtml(before) + '<mark>' + escapeHtml(match) + '</mark>' + escapeHtml(after);
  }

  function snippetAround(cifraNorm, cifraOriginal, query) {
    const idx = cifraNorm.indexOf(query);
    if (idx === -1) return '';
    const start = Math.max(0, idx - 20);
    const end = Math.min(cifraOriginal.length, idx + query.length + 30);
    let snip = cifraOriginal.slice(start, end).replace(/\s+/g, ' ').trim();
    if (start > 0) snip = '…' + snip;
    if (end < cifraOriginal.length) snip = snip + '…';
    return snip;
  }

  function renderList() {
    const rawQuery = searchInput.value.trim();
    const query = normalize(rawQuery);
    clearBtn.classList.toggle('show', rawQuery.length > 0);

    let results;
    if (!query) {
      results = SONGS_SORTED;
    } else if (/^\d+$/.test(rawQuery)) {
      const pageNum = parseInt(rawQuery, 10);
      results = SONGS_SORTED.filter(function(s) { return s.page === pageNum; });
    } else {
      results = SONGS_SORTED.filter(function(s) { return s._searchFull.indexOf(query) !== -1; });
    }

    metaEl.textContent = results.length + (results.length === 1 ? ' música encontrada' : ' músicas encontradas') +
      (query && !/^\d+$/.test(rawQuery) ? '' : '');

    if (results.length === 0) {
      listEl.innerHTML = '<div class="empty-state">Nenhuma música encontrada para "' + escapeHtml(rawQuery) + '"</div>';
      return;
    }

    const isTextQuery = query && !/^\d+$/.test(rawQuery);
    let html = '';
    results.forEach(function(s) {
      const titleMatches = s._searchTitle.indexOf(query) !== -1;
      let snippetHtml = '';
      if (isTextQuery && !titleMatches) {
        const snip = snippetAround(s._searchFull, s.title + ' ' + s.artist + ' ' + s.cifra, query);
        if (snip) snippetHtml = '<div class="snippet">' + highlight(snip, query) + '</div>';
      }
      html += '<div class="song-item" data-id="' + s.id + '">' +
        '<div class="info">' +
          '<div class="title">' + (isTextQuery ? highlight(s.title, query) : escapeHtml(s.title)) + '</div>' +
          (s.artist ? '<div class="artist">' + (isTextQuery ? highlight(s.artist, query) : escapeHtml(s.artist)) + '</div>' : '') +
          snippetHtml +
        '</div>' +
        '<div class="page-badge">' + s.page + '</div>' +
      '</div>';
    });
    listEl.innerHTML = html;

    Array.prototype.forEach.call(listEl.querySelectorAll('.song-item'), function(el) {
      el.addEventListener('click', function() {
        const id = parseInt(el.getAttribute('data-id'), 10);
        location.hash = '#/musica/' + id;
      });
    });
  }

  let searchDebounce;
  searchInput.addEventListener('input', function() {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(renderList, 90);
  });
  clearBtn.addEventListener('click', function() {
    searchInput.value = '';
    renderList();
    searchInput.focus();
  });

  // ---------- Tela da música ----------
  const cifraContent = document.getElementById('cifra-content');
  const cifraScroll = document.getElementById('cifra-scroll');
  const songTitleEl = document.getElementById('song-title');
  const songArtistEl = document.getElementById('song-artist');
  const songPageEl = document.getElementById('song-page');
  const backBtn = document.getElementById('back-btn');

  const CHORD_LINE_RE = /^[\sA-G0-9#b/()xX*.,+superidimMmaj°ø\-–|:]+$/;
  function isChordLine(line) {
    const t = line.trim();
    return t.length > 0 && t.length < 50 && CHORD_LINE_RE.test(line) && /[A-G]/.test(t);
  }

  const measureCanvas = document.createElement('canvas');
  const measureCtx = measureCanvas.getContext('2d');
  function measureLineWidthPx(text, fontSizePx, fontFamily) {
    measureCtx.font = fontSizePx + 'px ' + fontFamily;
    return measureCtx.measureText(text).width;
  }

  const MIN_LINE_SIZE = 8;

  /**
   * Monta o HTML da cifra linha a linha. Cada linha usa o tamanho de fonte
   * padrão (fontSize), a não ser que ela seja larga demais pra caber na
   * tela — nesse caso só ELA (e a linha de acorde/letra correspondente,
   * pra manter o alinhamento entre as duas) é encolhida. Isso evita ter
   * que rolar a tela pro lado, e evita encolher a música inteira por causa
   * de uma única linha longa (ex: uma introdução instrumental).
   */
  function getAvailableWidth() {
    // cifraContent.clientWidth pode vir 0 bem no instante em que a tela
    // acabou de ficar visível (o navegador ainda não terminou o layout).
    // Nesse caso, usamos a largura da janela como base de cálculo, pra
    // nunca deixar de encolher uma linha por engano.
    var w = cifraContent.clientWidth;
    if (!w || w < 100) {
      w = Math.min(720, document.documentElement.clientWidth || window.innerWidth || 360);
    }
    return w - 32; // padding lateral (16px de cada lado)
  }

  function renderCifra(song) {
    const lines = song.cifra.split('\n');
    const family = getComputedStyle(cifraContent).fontFamily;
    const available = getAvailableWidth();
    const isChord = lines.map(isChordLine);
    const sizes = new Array(lines.length).fill(fontSize);
    const consumed = new Array(lines.length).fill(false);

    for (let i = 0; i < lines.length; i++) {
      if (consumed[i]) continue;
      const group = [i];
      // se esta linha é de acorde e a próxima é a letra logo abaixo dela,
      // as duas precisam encolher juntas na mesma proporção pra continuar alinhadas
      if (isChord[i] && i + 1 < lines.length && !isChord[i + 1] && lines[i + 1].trim() !== '') {
        group.push(i + 1);
        consumed[i + 1] = true;
      }
      let maxWidth = 0;
      group.forEach(function(gi) {
        const w = measureLineWidthPx(lines[gi], fontSize, family);
        if (w > maxWidth) maxWidth = w;
      });
      let size = fontSize;
      if (available > 0 && maxWidth > available) {
        size = Math.max(MIN_LINE_SIZE, Math.floor(fontSize * (available / maxWidth)));
      }
      group.forEach(function(gi) { sizes[gi] = size; });
    }

    let html = '';
    lines.forEach(function(line, i) {
      const cls = isChord[i] ? 'cifra-line chordline' : 'cifra-line';
      const inner = line.length ? escapeHtml(line) : '&nbsp;';
      html += '<div class="' + cls + '" style="font-size:' + sizes[i] + 'px">' + inner + '</div>';
    });
    return html;
  }

  let currentSong = null;

  function openSong(id) {
    const song = SONGS.find(function(s) { return s.id === id; });
    if (!song) { location.hash = '#/'; return; }
    currentSong = song;
    songTitleEl.textContent = song.title;
    songArtistEl.textContent = song.artist || '';
    songPageEl.textContent = 'pág. ' + song.page;
    screenList.style.display = 'none';
    screenSong.style.display = 'flex';
    cifraScroll.scrollTop = 0;
    stopAutoScroll();
    // Duplo rAF: garante que o navegador já terminou de desenhar a troca de
    // tela (display none -> flex) antes de medir a largura disponível.
    // Depois, mede de novo com um pequeno atraso como reforço (alguns
    // navegadores demoram um pouco mais pra estabilizar o layout).
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        cifraContent.innerHTML = renderCifra(song);
        setTimeout(function() {
          if (currentSong === song) cifraContent.innerHTML = renderCifra(song);
        }, 120);
      });
    });
  }

  function closeSong() {
    stopAutoScroll();
    releaseWakeLock();
    currentSong = null;
    screenSong.style.display = 'none';
    screenList.style.display = 'flex';
  }

  function refreshCifra() {
    if (!currentSong) return;
    cifraContent.innerHTML = renderCifra(currentSong);
  }
  let resizeDebounce;
  window.addEventListener('resize', function() {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(refreshCifra, 150);
  });

  backBtn.addEventListener('click', function() {
    // Navegação direta e determinística (evita history.back(), que é
    // instável dentro do iframe sandbox do Apps Script).
    closeSong();
    if (location.hash) location.hash = '';
  });

  // ---------- Roteamento por hash (permite link direto para uma música) ----------
  let routing = false;
  function router() {
    if (routing) return;
    routing = true;
    const hash = location.hash;
    const m = hash.match(/^#\/musica\/(\d+)/);
    if (m) {
      openSong(parseInt(m[1], 10));
    } else {
      closeSong();
    }
    routing = false;
  }
  window.addEventListener('hashchange', router);

  // ---------- Tamanho da fonte ----------
  const fontSizeLabel = document.getElementById('font-size-label');
  let fontSize = parseInt(localStorage.getItem('mcj_font_size') || '16', 10);
  function applyFontSize() {
    document.documentElement.style.setProperty('--cifra-size', fontSize + 'px');
    fontSizeLabel.textContent = fontSize;
    localStorage.setItem('mcj_font_size', fontSize);
    refreshCifra();
  }
  document.getElementById('font-plus').addEventListener('click', function() {
    fontSize = Math.min(28, fontSize + 2); applyFontSize();
  });
  document.getElementById('font-minus').addEventListener('click', function() {
    fontSize = Math.max(11, fontSize - 2); applyFontSize();
  });
  applyFontSize();


  // ---------- Rolagem automática ----------
  const playBtn = document.getElementById('play-btn');
  const speedRange = document.getElementById('speed-range');
  let scrolling = false;
  let intervalId = null;
  const TICK_MS = 40; // ~25 passos por segundo

  speedRange.value = localStorage.getItem('mcj_speed') || '4';

  function speedToPxPerTick(v) {
    // 1 -> bem devagar, 10 -> rápido
    return (0.4 + v * v * 0.09);
  }

  function scrollTick() {
    if (!scrolling) return;
    const px = speedToPxPerTick(parseInt(speedRange.value, 10) || 4);
    cifraScroll.scrollTop = cifraScroll.scrollTop + px;
    if (cifraScroll.scrollTop + cifraScroll.clientHeight >= cifraScroll.scrollHeight - 1) {
      stopAutoScroll();
    }
  }

  function startAutoScroll() {
    if (scrolling) return;
    scrolling = true;
    playBtn.textContent = '⏸ Pausar';
    playBtn.classList.add('active');
    intervalId = setInterval(scrollTick, TICK_MS);
    requestWakeLock();
  }
  function stopAutoScroll() {
    scrolling = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    playBtn.textContent = '▶ Rolagem';
    playBtn.classList.remove('active');
  }
  playBtn.addEventListener('click', function() {
    scrolling ? stopAutoScroll() : startAutoScroll();
  });
  speedRange.addEventListener('input', function() {
    localStorage.setItem('mcj_speed', speedRange.value);
  });
  speedRange.addEventListener('click', function(e) { e.stopPropagation(); });

  // ---------- Tela sempre ativa (Wake Lock) ----------
  const wakeBtn = document.getElementById('wake-btn');
  const wakeStatus = document.getElementById('wake-status');
  const wakeStatusText = document.getElementById('wake-status-text');
  let wakeLock = null;
  let wakeWanted = false;
  const wakeSupported = 'wakeLock' in navigator;

  function setWakeUi(active) {
    wakeBtn.classList.toggle('active', active);
    wakeStatus.classList.toggle('off', !active);
    if (!wakeSupported) {
      wakeStatusText.textContent = 'Recurso não suportado neste navegador';
    } else {
      wakeStatusText.textContent = active ? 'Tela vai permanecer ligada' : 'Tela pode bloquear normalmente';
    }
  }

  async function requestWakeLock() {
    wakeWanted = true;
    if (!wakeSupported) { setWakeUi(false); return; }
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function() { setWakeUi(false); });
      setWakeUi(true);
    } catch (err) {
      setWakeUi(false);
    }
  }
  function releaseWakeLock() {
    wakeWanted = false;
    if (wakeLock) { wakeLock.release().catch(function(){}); wakeLock = null; }
    setWakeUi(false);
  }
  wakeBtn.addEventListener('click', function() {
    (wakeLock ? releaseWakeLock() : requestWakeLock());
  });
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && wakeWanted && !wakeLock) {
      requestWakeLock();
    }
  });
  setWakeUi(false);

  // ---------- Início ----------
  loadSongs();
</script>
</body>
</html>
